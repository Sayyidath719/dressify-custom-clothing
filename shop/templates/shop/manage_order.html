{% extends 'shop/base.html' %}

{% block content %}
<div class="d-flex">

    
    

    <!-- MAIN CONTENT -->
    <div class="main-content full-width-page">
        <h2>Order Details 🧾</h2>
    <div class="row mt-4">

    
        <div class="row mt-4" style="width:100%; margin:0;">

    <!-- Customer -->
    <div class="col-md-4">
        <div class="card p-4 text-center h-100">
            <h5>👤 Customer</h5>
            <p><strong>{{ order.user.username }}</strong></p>
            <p>{{ order.order_date }}</p>
            <p>₹{{ order.total_amount }}</p>
        </div>
    </div>

    <!-- Status -->
    <div class="col-md-4">
        <div class="card p-4 text-center h-100">
            <h5>📦 Status</h5>
            <p>Current: <strong>{{ order.status }}</strong></p>

            <form method="POST">
    {% csrf_token %}

    <!-- STATUS -->
 <select name="status" class="form-control mb-2">
    <option value="pending" {% if order.status == "pending" %}selected{% endif %}>Pending</option>
    
    <option value="shipped" {% if order.status == "shipped" %}selected{% endif %}>Shipped</option>
    
    <option value="delivered" {% if order.status == "delivered" %}selected{% endif %}>Delivered</option>
    
    <option value="cancelled" {% if order.status == "cancelled" %}selected{% endif %}>Cancelled</option>
</select>

    <!-- COURIER -->
    <div class="mb-2">
        <label>Courier</label>
        <select name="courier" class="form-control">
    <option value="">Select Courier</option>

    <option value="DTDC" {% if order.courier == "DTDC" %}selected{% endif %}>DTDC</option>

    <option value="India Post" {% if order.courier == "India Post" %}selected{% endif %}>India Post</option>
</select>
    </div>

    <!-- TRACKING -->
    <div class="mb-2">
        <label>Tracking ID</label>
        <input type="text" name="tracking_id" 
       value="{{ order.tracking_id }}" 
       class="form-control" 
       placeholder="Enter Tracking ID">
    </div>

    <!-- BUTTON -->
    <button class="btn btn-success w-100">
        Update Status
    </button>
</form>
    <!-- Payment -->
    <div class="col-md-4">
        <div class="card p-4 text-center h-100">
            <h5>💳 Payment</h5>
            <p>Status: <strong>{{ order.payment_status }}</strong></p>
        </div>
    </div>

</div>
</div>
</div>
{% endblock %}
