{% extends 'shop/base.html' %}

{% block content %}

<div class="container mt-5">
    <h3>🔔 Notifications</h3>

    {% for n in notifications %}
        <div class="card p-3 mb-2">
            {{ n.message }}
        </div>
    {% empty %}
        <p>No notifications</p>
    {% endfor %}
</div>

{% endblock %}
