{% extends 'shop/base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="fw-bold mb-4">👕 My Products</h2>

    <div class="row">

        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm p-3 text-center">

        {% if product.image %}
    <div style="height:200px; display:flex; align-items:center; justify-content:center;">
        <img src="{{ product.image.url }}" alt="product" style="max-height:100%; max-width:100%;">
    </div>
{% else %}
    <div style="height:200px; display:flex; align-items:center; justify-content:center;">
        <img src="https://via.placeholder.com/200x200?text=No+Image" style="max-height:100%; max-width:100%;">
    </div>
{% endif %}

                <h5>{{ product.name }}</h5>
                <p class="text-muted">₹{{ product.base_price }}</p>

                <form method="POST" action="{% url 'remove_seller_product' product.id %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger btn-sm">
        Remove
    </button>
</form>

            </div>
        </div>
        {% empty %}
        <p>No products added yet</p>
        {% endfor %}

    </div>

</div>

{% endblock %}
