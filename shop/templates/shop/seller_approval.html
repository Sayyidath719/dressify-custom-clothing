{% extends 'shop/base.html' %}

{% block content %}

<div class="container mt-4">
    <h2>Seller Approval</h2>

    {% for seller in sellers %}
    <div class="card p-3 mb-3">
        <h5>{{ seller.user.username }}</h5>
        <p>{{ seller.user.email }}</p>

        <a href="{% url 'approve_seller' seller.id %}" class="btn btn-success btn-sm">
            Approve
        </a>

        <a href="{% url 'reject_seller' seller.id %}" class="btn btn-danger btn-sm">
            Reject
        </a>
    </div>
    {% empty %}
    <p>No pending sellers</p>
    {% endfor %}

</div>

{% endblock %}
