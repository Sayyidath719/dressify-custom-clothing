{% extends 'shop/admin_dashboard.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="mb-4 fw-bold">Payments 💳</h2>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>Order</th>
                    <th>User</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody>
                {% for p in payments %}
                <tr>
                    <td>#{{ p.order.id }}</td>
                    <td>{{ p.user.username }}</td>
                    <td>{{ p.method }}</td>
                    <td>
                        <span class="badge {% if p.status == 'COMPLETED' %}bg-success{% else %}bg-warning{% endif %}">
                            {{ p.status }}
                        </span>
                    </td>
                    <td>₹{{ p.amount }}</td>
                    <td>{{ p.created_at|date:"M d, Y" }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</div>

{% endblock %}
