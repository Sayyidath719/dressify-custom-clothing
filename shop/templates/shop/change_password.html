{% extends 'shop/base.html' %}

{% block content %}
<div style="margin-top: 120px;">
<div class="container mt-5">
    <div class="col-md-6 mx-auto">

        <div class="card shadow">
            <div class="card-header text-white" style="background-color: var(--navbar-color);">
                <h4>Change Password</h4>
            </div>

            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% if form.errors %}
    <div style="color:red;">
        {{ form.errors }}
    </div>
{% endif %}

{{ form.as_p }}

                    <button class="btn w-100 text-white" style="background-color: var(--navbar-color);">
                        Update Password
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
</div>
{% endblock %}
